<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="title desc">
  <title id="title">A gently toppled chess pawn</title>
  <desc id="desc">A rose-colored pawn rests on its side beside a small warm lamp glow.</desc>
  <defs>
