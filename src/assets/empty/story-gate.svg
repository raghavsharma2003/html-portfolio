<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="title desc">
  <title id="title">A glowing curtained window</title>
  <desc id="desc">Warm light waits behind rose curtains in a deep indigo night wall.</desc>
  <defs>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="17" result="noise"/>
      <feComponentTransfer in="noise" result="softNoise"><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="soft-light"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <g filter="url(#grain)">
    <path d="M76 29h208v190H76z" fill="#011036" stroke="#26201b" stroke-width="4" stroke-linejoin="round"/>
    <rect x="104" y="49" width="152" height="143" rx="3" fill="#f2b75b" opacity=".28" filter="url(#glow)"/>
    <rect x="103" y="48" width="154" height="145" rx="2" fill="#f8d08b" stroke="#26201b" stroke-width="4"/>
    <path d="M180 49v143M104 119h152" fill="none" stroke="#26201b" stroke-width="3" opacity=".58"/>
    <path d="M104 48h44c-5 20-2 39 9 59-10 18-15 46-11 85h-42z" fill="#c23f56" stroke="#26201b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M256 48h-44c5 20 2 39-9 59 10 18 15 46 11 85h42z" fill="#c23f56" stroke="#26201b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M120 55c-3 40-2 82 3 127M240 55c3 40 2 82-3 127" fill="none" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round" opacity=".28"/>
    <path d="M147 108c8 3 14 3 20 0M213 108c-8 3-14 3-20 0" fill="none" stroke="#f2b75b" stroke-width="4" stroke-linecap="round"/>
    <path d="M62 219h236" fill="none" stroke="#26201b" stroke-width="5" stroke-linecap="round"/>
    <path d="M282 70a20 20 0 0 0-21-19 20 20 0 1 1 21 19z" fill="#f8d08b"/>
  </g>
</svg>
