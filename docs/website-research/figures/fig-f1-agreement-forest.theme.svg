<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-labelledby="ttl dsc">
<title id="ttl">F1 — Pooled judge agreement against the pre-registered bar and the ground truth's own test-retest ceiling</title>
<desc id="dsc">Forest plot. Five candidate judges show pooled unit-level agreement between 28.1% and 54.2% with the trusted verdict set. Every cluster-bootstrap 95% interval lies far below the pre-registered 80% bar. A hatched vertical band marks the ground truth's own test-retest ceiling, 77.1% with a 95% interval of [67.7%, 84.4%], measured by having the archive's own author re-judge it; the pre-registered bar sits above that ceiling. The candidates fall 22.9 to 49.0 percentage points below the ceiling. One anthropic reference row is shown in a separate band and is labelled an invalid parse-selected run, not a result.</desc>
<defs>
  <pattern id="hatch" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="5" height="5" fill="var(--fig-bg, #ffffff)"/>
    <line x1="0" y1="0" x2="0" y2="5" stroke="var(--fig-muted, #8f8f8f)" stroke-width="2"/>
  </pattern>
  <pattern id="hatchLight" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="6" height="6" fill="var(--fig-bg, #ffffff)"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="var(--fig-grid, #d4d4d4)" stroke-width="2.5"/>
  </pattern>
</defs>
