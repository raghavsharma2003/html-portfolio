<svg xmlns="http://www.w3.org/2000/svg" width="960" height="448" viewBox="0 0 960 448" role="img" aria-labelledby="ttl dsc">
<title id="ttl">F3 — Hinglish versus English agreement per judge, against the measured noise floor</title>
<desc id="dsc">Paired dumbbell plot for five judges. Recoveries from the Hinglish to the English condition run from minus 3.1 to plus 6.6 percentage points, mean plus 3.2. Every English point falls inside a shaded plus-or-minus 13.6 percentage point noise band centred on its Hinglish value, every clustered confidence interval overlaps its counterpart, and no judge approaches the 80% qualification bar in either condition.</desc>
<defs>
  <pattern id="hatch" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="5" height="5" fill="var(--fig-bg, #ffffff)"/>
    <line x1="0" y1="0" x2="0" y2="5" stroke="var(--fig-muted, #8f8f8f)" stroke-width="2"/>
  </pattern>
  <pattern id="hatchLight" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="6" height="6" fill="var(--fig-bg, #ffffff)"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="var(--fig-grid, #d4d4d4)" stroke-width="2.5"/>
  </pattern>
</defs>
