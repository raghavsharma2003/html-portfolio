<text x="12.0" y="364.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start" fill="#9a9a9a">Read Panel B as: a judge lying ON the dashed curve is producing exactly the tie rate its slot-A propensity alone predicts — its content signal is gone. Mistral-Large-3 sits on the curve</text>
<text x="12.0" y="375.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start" fill="#9a9a9a">on both archives; the trusted judge sits far below it at a comparable pick rate, which is what carrying content information looks like. Curve is analytic (see §4.2/§5.3); all points are measured.</text>
<text x="12.0" y="390.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start" fill="#9a9a9a">Source: docs/paper/analysis/derive-tables.mjs --json (T2 perCell, T3 pooled, T1 ground truth). Cohere command-a-plus is absent: 34 parsed rows of 192, no scorable units.</text>
