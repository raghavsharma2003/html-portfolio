<text x="12.0" y="38.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="start" fill="#5b5b5b">Left: how often each judge picked the first-presented reply. Right: what that propensity alone predicts, and where each judge actually sits.</text>
