<svg xmlns="http://www.w3.org/2000/svg" width="960" height="406" viewBox="0 0 960 406" role="img" aria-labelledby="ttl dsc">
<title id="ttl">F2 — Slot-A pick rates and the evacuation of the counterbalance</title>
<desc id="dsc">Two panels. Left: pooled slot-A pick rates run from 62.0% for gpt-5.6-terra to 89.6% for Mistral-Large-3, against 58.9% for the trusted judge on identical rows and a 50% reference. Right: observed TIE_FLIP rate plotted against slot-A pick rate for each judge and archive, with the analytic content-blind prediction q squared plus one-minus-q squared drawn as a dashed curve. Mistral-Large-3 lies on the curve on both archives; gpt-5.6-terra and the trusted judge lie far below it.</desc>
<defs>
  <pattern id="hatch" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="5" height="5" fill="#ffffff"/>
    <line x1="0" y1="0" x2="0" y2="5" stroke="#8f8f8f" stroke-width="2"/>
  </pattern>
  <pattern id="hatchLight" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="6" height="6" fill="#ffffff"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#d4d4d4" stroke-width="2.5"/>
  </pattern>
</defs>
