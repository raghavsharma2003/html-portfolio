<svg xmlns="http://www.w3.org/2000/svg" width="920" height="492" viewBox="0 0 920 492" role="img" aria-labelledby="ttl dsc">
<title id="ttl">F1 — Pooled judge agreement with clustered confidence intervals against the 80% qualification bar</title>
<desc id="dsc">Forest plot. Five candidate judges show pooled unit-level agreement between 28.1% and 54.2% with the trusted verdict set. Every cluster-bootstrap 95% interval lies far below the pre-registered 80% bar, with interval upper bounds between 38.5% and 64.6%. Four of the five overlap the 30.5% uniform-random baseline. Two anthropic reference rows are shown in a separate band and are labelled invalid transport-selected runs, not results.</desc>
<defs>
  <pattern id="hatch" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="5" height="5" fill="#ffffff"/>
    <line x1="0" y1="0" x2="0" y2="5" stroke="#8f8f8f" stroke-width="2"/>
  </pattern>
  <pattern id="hatchLight" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="6" height="6" fill="#ffffff"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#d4d4d4" stroke-width="2.5"/>
  </pattern>
</defs>
<rect x="0.0" y="0.0" width="920.0" height="492.0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="12.0" y="22.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#111111">F1 — Pooled agreement with the trusted verdict set, against the pre-registered bar</text>
<text x="12.0" y="38.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="start" fill="#5b5b5b">Hinglish condition (run R0). Thick interval = cluster bootstrap, cluster = beat (12 clusters, 10,000 reps, seed 20260818).</text>
<text x="12.0" y="50.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="start" fill="#5b5b5b">Thin interval = naive Wilson binomial CI, drawn behind it to show exactly how much the independence assumption was buying.</text>
