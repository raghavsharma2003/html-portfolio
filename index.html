<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale / user-scalable=no. Blocking pinch-zoom is a WCAG
         1.4.4 failure, and on an app whose whole content is small text and
         her photos, "you may not zoom in" is a real thing to take away from
         someone who needs to. It was there to stop iOS zooming on input
         focus; the composer sets a 16px font size, which is what actually
         prevents that. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- One colour, unconditionally: the app is light-only now, so a
         media-scoped pair would leave the status bar dark above a light app on
         any phone set to dark mode. -->
    <meta name="theme-color" content="#faf7f4" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" />
    <title>Meera</title>
    <meta property="og:title" content="Meera — someone to talk to. Really talk to." />
    <meta property="og:description" content="An AI companion who texts in Hinglish, calls in a human voice, and remembers what matters to you." />
    <meta property="og:image" content="https://meera-silk.vercel.app/og-card.jpg" />
    <meta property="og:url" content="https://meera-silk.vercel.app/chat" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Meera" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
