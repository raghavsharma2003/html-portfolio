<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1e9" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      THE CASCADE LAYER ORDER, DECLARED WHERE A MINIFIER CANNOT REMOVE IT.

      `studio.css` and `design/tokens.css` both open with
      `@layer reset, tokens, base, components, responsive;`, and the build
      DROPPED it: LightningCSS treats a standalone layer statement as redundant
      and strips it, so the shipped stylesheet began `@layer components{`. Layer
      order is then fixed by first appearance, which made the real order
      components, reset, tokens, base, responsive, with RESET LAST OF THE FIRST
      FOUR and therefore beating everything it was written to lose to.

      What that shipped: `button { color: inherit }` in the reset out-ranked
      `.primary-button { color: #fffef9 }`, so every primary call to action
      rendered near-black ink on forest green at a measured 1.73:1 contrast,
      against a WCAG AA floor of 4.5:1 and DESIGN-LAW's "a CTA whose label does
      not read against its own background is a shipping defect".

      A statement inside an inline <style> in the document head is emitted
      verbatim and is the first layer declaration the browser sees, which is all
      that is required to fix the order for every sheet that follows.
      `scripts/check-layout.mjs` measures the contrast so this cannot regress
      silently again.
    -->
    <style>@layer reset, tokens, base, components, responsive;</style>
    <title>Replica Studio | Vyakti</title>
    <meta
      name="description"
      content="A private, consent-verified workspace for building and controlling your own AI replica."
    />
  </head>
  <body>
    <div id="studio-root"></div>
    <script type="module" src="/src/studio/main.tsx"></script>
  </body>
</html>
