version: v1.1.0
steps:
  - build: >-
      -t $Registry/vyakti/openvoice-converter-eval:$ID
      -f services/openvoice-converter/Dockerfile
      --build-arg VYAKTI_RUNTIME_SOURCE_SHA256=$SOURCE_MANIFEST_SHA256
      .
    timeout: 3600
  - push:
      - $Registry/vyakti/openvoice-converter-eval:$ID
  - build: >-
      -t $Registry/vyakti/openvoice-converter-gate:$ID
      -f services/openvoice-converter/Dockerfile.broker
      .
    timeout: 1200
  - push:
      - $Registry/vyakti/openvoice-converter-gate:$ID
