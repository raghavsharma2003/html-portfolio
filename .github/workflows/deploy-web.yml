# Build, gate and deploy the one Vyakti web product.
#
# The Vercel project owns runtime configuration. GitHub needs only a Vercel
# token; the build itself validates the project's Azure and database names and
# refuses before Vite when they are incomplete.
name: Deploy Vyakti web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vyakti-production
  cancel-in-progress: true

jobs:
  configured:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Report whether production deploys are configured
        id: check
        env:
          HAS_TOKEN: ${{ (secrets.VERCEL_TOKEN || secrets.VERCEL) != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Vyakti production deploys are configured"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Vyakti deploy is not configured::Add VERCEL_TOKEN (or VERCEL) as a repository secret. Production was not deployed."
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: configured
    if: needs.configured.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: node scripts/write-config.mjs --stub
        env:
          CI: "1"
      - name: Install the bundled Devanagari face
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          cp node_modules/@expo-google-fonts/noto-sans-devanagari/400Regular/NotoSansDevanagari_400Regular.ttf "$HOME/.local/share/fonts/"
          fc-cache -f "$HOME/.local/share/fonts"
          fc-list | grep -qi "Noto Sans Devanagari" || { echo "::error::Noto Sans Devanagari did not register"; exit 1; }
      - name: Install Chromium for release gates
        run: npx playwright install --with-deps chromium
      - name: Run the complete offline release gate
        run: node scripts/verify-release.mjs

      - name: Deploy Vyakti to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL }}
          VERCEL_ORG_ID: team_hQIoipGIvf1GHVj3878tDOR3
          VERCEL_PROJECT_ID: prj_rfW81HIge0vtG6nzIcO41OGB5fP9
        run: node scripts/deploy-vercel.mjs --product vyakti-clone --prod --yes --archive=tgz

      - name: Verify production is serving this checkout
        run: node scripts/verify-deploy.mjs https://vyakti-replica-lab.vercel.app --product vyakti-clone
