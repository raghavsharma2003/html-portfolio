name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx tsc -b
      # Fails the build if a system prompt outgrows the cap api/chat.js slices
      # it at. Truncation is silent and eats the END of the prompt, which is
      # where the crisis helplines, the AI-honesty rule and the search protocol
      # live — it has already cost us all three once.
      - run: node scripts/check-prompt-budget.mjs
      # The project's memory must stay valid: a decision whose measurement was
      # renamed, or an entry written up nowhere, is a story about the project
      # rather than a record of it.
      - run: node scripts/context.mjs --check
      # THE SAFETY FLOOR. Until 2026-08-21 no workflow ran this, so the persona
      # invariants — the crisis helplines, never-deny-being-an-AI, NEVER
      # MANIPULATE, the spoken-register bullets — gated NOTHING in CI. They ran
      # only when somebody remembered to run verify-release by hand. That is
      # `gates-that-live-nowhere` in its purest form: a suite everyone believed
      # was protecting the product while every push went around it.
      #
      # It could not have run before this: evals/trace/run.mjs reaches
      # api/_trace.js -> api/_db.js -> api/_config.js, which is gitignored, so
      # the import died before the suite got anywhere near the persona checks.
      # --stub writes that file with every value empty — nothing granted, and
      # an accidental query fails loudly rather than quietly reaching prod.
      - run: node scripts/write-config.mjs --stub
      - run: node evals/run.mjs
      # WS-WATCHPERF. Two suites that compile and RUN shipping Java, so this
      # job — the one that already installs a JDK to build the APK — is the
      # only place they can live. They gate the screen-share lane's two
      # reported defects: the frame pacing (evals/watchlat, which proves a wake
      # can no longer evaporate between the service's accounting of a frame and
      # the engine's) and the device-audio mixer (evals/watchaudio, which
      # proves by position that nothing in the barge-in floor can even name the
      # media buffers). Both FAIL rather than skip without javac.
      - run: node evals/watchperf/run.mjs
      - run: npx vite build
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: meera-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
