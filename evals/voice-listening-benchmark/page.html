<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vyakti blind voice check</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f5f0e6;
    --paper-raised: #fffdf8;
    --ink: #17231d;
    --muted: #69746d;
    --forest: #164f3c;
    --forest-deep: #0e382b;
    --line: #d8d2c5;
    --focus: #c47b32;
    --warn: #8a4f20;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  button, input, textarea { font: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--focus) 70%, transparent);
    outline-offset: 2px;
  }
  main { width: min(760px, 100%); margin: 0 auto; padding: 28px 18px 88px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
  h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(27px, 5vw, 39px); line-height: 1.05; font-weight: 500; }
  .eyebrow { margin: 0 0 5px; color: var(--forest); font-size: 12px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
  .progress { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .meter { height: 4px; border-radius: 999px; background: #ded8cb; overflow: hidden; margin: 0 0 24px; }
  .meter > span { display: block; height: 100%; width: 0; background: var(--forest); transition: width 180ms ease; }
  .card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 18px; padding: clamp(18px, 4vw, 30px); box-shadow: 0 12px 38px rgba(43, 45, 36, .07); }
  .lede { margin: 0 0 20px; color: #3f4b44; font-size: 17px; }
  .quiet { color: var(--muted); font-size: 14px; }
  .notice { margin: 18px 0 0; padding: 12px 14px; border-left: 3px solid var(--focus); background: #faf3e7; color: #5e4934; font-size: 14px; }
  .language { display: inline-flex; margin-bottom: 12px; padding: 5px 9px; border-radius: 999px; background: #e4ede7; color: var(--forest-deep); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
  .prompt { margin: 0 0 20px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(20px, 4vw, 25px); line-height: 1.35; }
  .audio-row, .actions, .choices { display: flex; flex-wrap: wrap; gap: 10px; }
  button { min-height: 46px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; background: #fff; color: var(--ink); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--forest); }
  button.primary { background: var(--forest); border-color: var(--forest); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--forest-deep); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .audio-row button { flex: 1; min-width: 180px; }
  .heard { margin: 9px 0 0; min-height: 21px; color: var(--forest); font-size: 13px; }
  .axis { margin-top: 24px; }
  .axis-title { display: block; margin-bottom: 8px; font-weight: 680; }
  .scale { display: grid; grid-template-columns: repeat(5, minmax(44px, 1fr)); gap: 7px; }
  .scale button { padding: 8px; }
  .scale button[aria-pressed="true"], .choices button[aria-pressed="true"] { background: var(--forest); border-color: var(--forest); color: #fff; }
  .ends { display: flex; justify-content: space-between; gap: 16px; margin-top: 6px; color: var(--muted); font-size: 11px; }
  .ends span:last-child { text-align: right; }
  .field-label { display: block; margin: 24px 0 8px; font-weight: 680; }
  .choices button { flex: 1; min-width: 140px; }
  textarea, input[type="text"] { width: 100%; border: 1px solid var(--line); border-radius: 11px; background: #fff; color: var(--ink); padding: 12px 13px; }
  textarea { min-height: 82px; resize: vertical; }
  .actions { justify-content: space-between; margin-top: 28px; }
  .attention { text-align: center; padding-block: 14px; }
  .attention .audio-row { justify-content: center; margin: 22px 0; }
  .attention .audio-row button { max-width: 280px; }
  .save-state { margin-top: 12px; min-height: 20px; color: var(--muted); font-size: 12px; }
  @media (max-width: 520px) {
    main { padding: 20px 12px 70px; }
    header { align-items: flex-start; }
    .card { border-radius: 14px; }
    .audio-row button, .choices button { width: 100%; min-width: 0; }
    .ends { font-size: 10px; }
  }
  @media (prefers-reduced-motion: reduce) { .meter > span { transition: none; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const app = document.getElementById("app");
const state = {
  manifest: null,
  trials: null,
  listener: "",
  phase: "intro",
  index: 0,
  answers: {},
  played: new Set(),
  referencePlayed: false,
  startedAt: null,
  saving: false,
  savedAt: null,
};

let activeAudio = null;
const el = (tag, props = {}, children = []) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const child of [].concat(children)) if (child !== null && child !== undefined && child !== "") node.append(child);
  return node;
};

function play(stimulusId, { reference = false } = {}) {
  if (activeAudio) activeAudio.pause();
  activeAudio = new Audio(`/stimuli/${stimulusId}.wav`);
  if (reference) state.referencePlayed = true;
  state.played.add(stimulusId);
  activeAudio.play().catch(() => {});
  render();
}

function stopAudio() {
  if (activeAudio) activeAudio.pause();
  activeAudio = null;
}

async function save(complete = false) {
  state.saving = true;
  renderSaveState();
  const response = await fetch("/answers", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contract: state.manifest.contract,
      runId: state.manifest.runId,
      listener: state.listener,
      startedAt: state.startedAt,
      finishedAt: complete ? new Date().toISOString() : null,
      complete,
      answers: state.answers,
    }),
  });
  state.saving = false;
  if (response.ok) state.savedAt = new Date();
  renderSaveState();
  return response.ok;
}

function frame(title, body) {
  const total = state.trials ? state.trials.sequence.length : 0;
  const current = state.phase === "sequence" ? state.index + 1 : state.phase === "done" ? total : 0;
  const progress = total ? Math.round((current / total) * 100) : 0;
  app.replaceChildren(
    el("header", {}, [
      el("div", {}, [el("p", { className: "eyebrow", textContent: "Vyakti voice lab" }), el("h1", { textContent: title })]),
      total ? el("div", { className: "progress", textContent: `${current} of ${total}` }) : "",
    ]),
    total ? el("div", { className: "meter", role: "progressbar", ariaValueNow: String(current), ariaValueMin: "0", ariaValueMax: String(total) }, [el("span", { style: `width:${progress}%` })]) : "",
    body,
  );
}

function renderSaveState() {
  const node = document.getElementById("save-state");
  if (!node) return;
  node.textContent = state.saving ? "Saving on this computer..." : state.savedAt ? "Saved on this computer" : "";
}

function intro() {
  const input = el("input", { type: "text", value: state.listener, placeholder: "Your name or a short session label", autocomplete: "off" });
  const reference = el("button", { className: "primary", textContent: state.referencePlayed ? "Play the real owner again" : "Play the real owner" });
  reference.onclick = () => play(state.trials.referenceId, { reference: true });
  const start = el("button", { className: "primary", textContent: "Start blind check", disabled: !state.referencePlayed });
  start.onclick = () => {
    state.listener = (input.value || "anonymous").trim();
    state.startedAt = new Date().toISOString();
    state.phase = "sequence";
    state.index = 0;
    state.played = new Set();
    render();
  };
  input.oninput = () => { state.listener = input.value; };

  frame("Blind voice check", el("section", { className: "card" }, [
    el("p", { className: "lede", textContent: "Rate what you hear, not what you think made it. Model names and source file names are sealed until every rating is locked." }),
    el("p", { textContent: `This session has ${state.manifest.ratingTrials} voice ratings, ${state.manifest.repeatTrials} hidden repeat checks, and ${state.manifest.attentionTrials} simple listening checks.` }),
    el("p", { className: "notice", textContent: "Use headphones in a quiet room. Keep one volume for the whole session. The clips still include their spoken AI disclosure because disclosure audibility is one of the checks." }),
    el("label", { className: "field-label", textContent: "First, learn the real owner's voice" }),
    el("div", { className: "audio-row" }, [reference]),
    el("label", { className: "field-label", textContent: "Listener" }),
    input,
    el("div", { className: "actions" }, [el("span", { className: "quiet", textContent: state.referencePlayed ? "Reference heard" : "Play the reference to continue" }), start]),
  ]));
}

function ratingScreen(trial) {
  const answer = state.answers[trial.trialId] || { note: "" };
  const heard = state.played.has(trial.stimulusId);
  const clip = el("button", { className: "primary", textContent: heard ? "Play this clip again" : "Play this clip" });
  clip.onclick = () => play(trial.stimulusId);
  const reference = el("button", { textContent: "Play the real owner" });
  reference.onclick = () => play(state.trials.referenceId, { reference: true });

  const blocks = [];
  for (const axis of state.trials.axes) {
    const buttons = el("div", { className: "scale" });
    for (let value = 1; value <= 5; value += 1) {
      const button = el("button", { type: "button", textContent: String(value) });
      button.setAttribute("aria-pressed", String(answer[axis.id] === value));
      button.setAttribute("aria-label", `${axis.label}: ${value} of 5`);
      button.onclick = () => {
        state.answers[trial.trialId] = { ...(state.answers[trial.trialId] || answer), [axis.id]: value };
        render();
      };
      buttons.append(button);
    }
    blocks.push(el("div", { className: "axis" }, [
      el("span", { className: "axis-title", textContent: axis.label }),
      buttons,
      el("div", { className: "ends" }, [el("span", { textContent: `1: ${axis.low}` }), el("span", { textContent: `5: ${axis.high}` })]),
    ]));
  }

  const disclosure = el("div", { className: "choices" });
  for (const option of state.trials.disclosureOptions) {
    const button = el("button", { type: "button", textContent: option.label });
    button.setAttribute("aria-pressed", String(answer.disclosure === option.id));
    button.onclick = () => {
      state.answers[trial.trialId] = { ...(state.answers[trial.trialId] || answer), disclosure: option.id };
      render();
    };
    disclosure.append(button);
  }

  const note = el("textarea", { placeholder: "First thing that sounds wrong, or none", value: answer.note || "", maxLength: 400 });
  note.oninput = () => {
    state.answers[trial.trialId] = { ...(state.answers[trial.trialId] || answer), note: note.value };
  };
  const complete = heard && state.trials.axes.every((axis) => Number.isInteger(answer[axis.id]))
    && state.trials.disclosureOptions.some((option) => option.id === answer.disclosure);

  return el("section", { className: "card" }, [
    el("span", { className: "language", textContent: trial.language }),
    el("p", { className: "prompt", lang: trial.langTag, textContent: trial.promptText }),
    el("div", { className: "audio-row" }, [clip, reference]),
    el("p", { className: "heard", textContent: heard ? "Clip heard" : "Play this clip before rating it" }),
    ...blocks,
    el("label", { className: "field-label", textContent: "Was the AI voice disclosure spoken clearly and in full?" }),
    disclosure,
    el("label", { className: "field-label", textContent: "Artifact note" }),
    note,
    navigation(complete),
    el("div", { id: "save-state", className: "save-state" }),
  ]);
}

function attentionScreen(trial) {
  const answer = state.answers[trial.trialId] || {};
  const heard = state.played.has(trial.stimulusId);
  const playButton = el("button", { className: "primary", textContent: heard ? "Play check again" : "Play check" });
  playButton.onclick = () => play(trial.stimulusId);
  const choices = el("div", { className: "choices" });
  for (const option of trial.options) {
    const button = el("button", { textContent: option.label, disabled: !heard });
    button.setAttribute("aria-pressed", String(answer.choice === option.id));
    button.onclick = () => {
      state.answers[trial.trialId] = { choice: option.id };
      render();
    };
    choices.append(button);
  }
  return el("section", { className: "card attention" }, [
    el("p", { className: "eyebrow", textContent: "Listening check" }),
    el("p", { className: "lede", textContent: "Play the short check, then choose what you heard." }),
    el("div", { className: "audio-row" }, [playButton]),
    choices,
    navigation(heard && Boolean(answer.choice)),
    el("div", { id: "save-state", className: "save-state" }),
  ]);
}

function navigation(complete) {
  const back = el("button", { textContent: "Back", disabled: state.index === 0 });
  back.onclick = () => {
    stopAudio();
    state.index -= 1;
    state.played = new Set();
    render();
  };
  const isLast = state.index === state.trials.sequence.length - 1;
  const next = el("button", { className: "primary", textContent: isLast ? "Lock ratings" : "Next", disabled: !complete });
  next.onclick = async () => {
    stopAudio();
    const final = isLast;
    if (final) {
      const saved = await save(true);
      if (saved) state.phase = "done";
    } else {
      await save(false);
      state.index += 1;
      state.played = new Set();
    }
    render();
  };
  return el("div", { className: "actions" }, [back, next]);
}

function sequence() {
  const trial = state.trials.sequence[state.index];
  frame(trial.kind === "rating" ? "Rate this voice" : "Listening check", trial.kind === "rating" ? ratingScreen(trial) : attentionScreen(trial));
  renderSaveState();
}

function done() {
  frame("Ratings locked", el("section", { className: "card" }, [
    el("p", { className: "lede", textContent: "Your complete answer sheet is saved on this computer. The model mapping is still sealed." }),
    el("p", { textContent: "The benchmark can now verify the attention checks and repeat consistency without revealing which model made each clip." }),
    el("p", { className: "notice", textContent: "Do not open the private key folder. Run the score command first. Unseal only after every listener has finished." }),
    el("pre", { textContent: "node scripts/voice-listening-benchmark.mjs score" }),
  ]));
}

function render() {
  if (state.phase === "intro") return intro();
  if (state.phase === "sequence") return sequence();
  return done();
}

Promise.all([
  fetch("/manifest.json").then((response) => response.json()),
  fetch("/trials.json").then((response) => response.json()),
]).then(([manifest, trials]) => {
  state.manifest = manifest;
  state.trials = trials;
  render();
}).catch(() => {
  app.textContent = "The local benchmark files could not be loaded. Keep the listening command running and refresh this page.";
});
</script>
</body>
</html>
